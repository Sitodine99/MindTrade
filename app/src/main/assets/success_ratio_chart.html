<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        #successRatioChart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<!-- 🔹 Contenedor del gráfico -->
<div id="successRatioChart"></div>

<script>
    var chartDom = document.getElementById('successRatioChart');
    var myChart = echarts.init(chartDom);
    var animationDuration = 1500; // 🔹 Duración de la animación

    function updateSuccessRate(successRate) {
        var option = {
            animationDuration: animationDuration, // 🔹 Animación solo al inicio
            series: [
                {
                    type: 'gauge',
                    startAngle: 180,
                    endAngle: 0,
                    min: 0,
                    max: 100,
                    splitNumber: 10,
                    axisLine: {
                        lineStyle: {
                            width: 20,
                            color: [[1, '#4B9CD3']]
                        }
                    },
                    pointer: {
                        show: true,
                        width: 8
                    },
                    axisTick: {
                        show: false
                    },
                    splitLine: {
                        show: false
                    },
                    axisLabel: {
                        show: false
                    },
                    detail: {
                        show: true,
                        fontSize: 50,
                        fontWeight: 'bold',
                        color: '#4B9CD3',
                        offsetCenter: [0, '70%'], // 🔹 Ubicación más baja
                        formatter: function(value) {
                            return value.toFixed(2) + " %"; // 🔹 Formato con 2 decimales
                        }
                    },
                    data: [
                        {
                            value: successRate
                        }
                    ]
                }
            ]
        };

        myChart.setOption(option);
    }

    // 🔹 Prueba inicial con un valor
    updateSuccessRate(75);

</script>

</body>
</html>
