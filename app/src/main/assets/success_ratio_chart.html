<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        #successRatioChart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<!-- 🔹 Gráfico de tasa de éxito -->
<div id="successRatioChart"></div>

<script>
    var chartDom = document.getElementById('successRatioChart');
    var myChart = echarts.init(chartDom);

    function updateSuccessRate(successRate) {
        var option = {
            series: [
                {
                    type: 'gauge',
                    startAngle: 180,
                    endAngle: 0,
                    min: 0,
                    max: 100,
                    splitNumber: 10,
                    axisLine: {
                        lineStyle: {
                            width: 15,
                            color: [[1, '#D4E6F1']]
                        }
                    },
                    pointer: {
                        show: true,
                        width: 10
                    },
                    axisTick: {
                        show: true,
                        distance: -10,
                        length: 8
                    },
                    splitLine: {
                        show: true,
                        distance: -15,
                        length: 15
                    },
                    axisLabel: {
                        distance: 15,
                        fontSize: 14,
                        color: '#333'
                    },
                    detail: {
                        show: true,
                        fontSize: 40, // 🔹 Aumenta el tamaño del porcentaje
                        fontWeight: 'bold',
                        color: '#333',
                        offsetCenter: [0, '80%'], // 🔹 Mueve el número más abajo
                        formatter: function(value) {
                            return value.toFixed(2) + " %"; // 🔹 Formato con 2 decimales
                        }
                    },
                    data: [
                        {
                            value: successRate,
                            name: '' // 🔹 Eliminado el texto "SCORE"
                        }
                    ]
                }
            ]
        };
        myChart.setOption(option);
    }

    // 🔹 Prueba con un valor inicial
    updateSuccessRate(50.5);
</script>

</body>
</html>
