<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden;">
<!-- Contenedor del gráfico -->
<div id="main" style="width: 100vw; height: 100vh;"></div>

<script>
    // Inicializar el gráfico
    var chart = echarts.init(document.getElementById('main'));

    // Función para actualizar el gráfico desde Android
    function updateChart(dataX, dataY) {
        var option = {
            tooltip: {
                trigger: 'axis',
                backgroundColor: '#fff',
                borderColor: '#ccc',
                borderWidth: 1,
                textStyle: {
                    color: '#000'
                }
            },
            xAxis: {
                type: 'category',
                data: dataX,
                axisLabel: {
                    show: false // 🔹 Ocultar etiquetas del eje X
                },
                axisTick: {
                    show: false // 🔹 Ocultar las marcas de los ticks en el eje X
                },
                boundaryGap: false
            },
            yAxis: {
                type: 'value',
                name: 'Balance ($)',
                nameLocation: 'center', // 🔹 Centrar la etiqueta del eje Y
                nameGap: 25, // 🔹 Espaciado para evitar corte
                nameTextStyle: {
                    fontSize: 14,
                    fontWeight: 'bold'
                },
                axisLabel: {
                    formatter: function (value) {
                        return value.toFixed(0); // 🔹 Redondear valores a enteros
                    },
                    fontSize: 12,
                    color: '#333'
                },
                min: function (value) {
                    return Math.floor(value.min * 0.9);
                },
                max: function (value) {
                    return Math.ceil(value.max * 1.1);
                },
                splitLine: {
                    lineStyle: {
                        type: 'dashed',
                        color: '#ddd'
                    }
                }
            },
            grid: {
                left: '15%',  // 🔹 Se aumentó de 10% a 15% para espacio en eje Y
                right: '10%',
                bottom: '10%', // 🔹 Se reduce margen inferior ya que el eje X no tiene etiquetas
                top: '10%', // 🔹 Se ajusta la parte superior
                containLabel: true
            },
            series: [{
                name: 'Balance',
                data: dataY,
                type: 'line',
                smooth: true,
                lineStyle: {
                    width: 3,
                    color: '#5470C6'
                },
                itemStyle: {
                    color: '#5470C6'
                },
                areaStyle: {
                    color: 'rgba(84,112,198,0.2)'
                },
                symbol: 'circle',
                symbolSize: 8
            }]
        };

        // Aplicar la configuración al gráfico
        chart.setOption(option);
    }

    // Ajustar el tamaño del gráfico cuando la ventana cambie
    window.onresize = function() {
        chart.resize();
    };

</script>
</body>
</html>
