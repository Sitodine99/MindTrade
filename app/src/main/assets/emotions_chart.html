<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        /* Asegura que el contenedor del gráfico ocupa toda la pantalla */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center;    /* Centra verticalmente */
            background-color: #ffffff; /* Color de fondo */
        }

        #chart {
            width: 80%; /* Ajusta el tamaño del gráfico */
            height: 80%;
        }
    </style>
</head>
<body>
<div id="chart"></div>
<script>
    const chart = echarts.init(document.getElementById('chart'));
    const option = {
        title: {
            text: 'Estado emocional',
            left: 'center',
            textStyle: {
                fontSize: 18,
                fontWeight: 'bold'
            }
        },
        tooltip: {
            trigger: 'item',
            formatter: '{b}: {c} ({d}%)' // Muestra el nombre, valor y porcentaje
        },
        series: [
            {
                name: 'Emociones',
                type: 'pie',
                radius: '50%',
                label: {
                    show: true,
                    position: 'outside', // Flechas hacia afuera
                    formatter: '{b}' // Solo muestra el nombre de la emoción
                },
                labelLine: {
                    show: true, // Líneas que conectan las etiquetas
                },
                data: [],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }
        ]
    };
    chart.setOption(option);

    function updatePieChart(data) {
        chart.setOption({
            series: [
                {
                    data: data
                }
            ]
        });
    }
</script>
</body>
</html>
